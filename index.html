<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Ball Sort FPS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Crosshair */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: white;
      box-shadow: 0 0 3px black;
    }

    #crosshair::before {
      width: 18px;
      height: 2px;
      left: 0;
      top: 8px;
    }

    #crosshair::after {
      width: 2px;
      height: 18px;
      left: 8px;
      top: 0;
    }

    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 2px 4px black;
      pointer-events: none;
      z-index: 10;
    }

    #restart {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #restart:hover {
      background: rgba(40, 40, 40, 0.9);
    }
  </style>
</head>

<body>

  <canvas id="game"></canvas>

  <div id="crosshair"></div>

  <div id="hud">
    Sorted: <span id="score">0</span> / 6
  </div>

  <button id="restart">Restart</button>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    const canvas = document.getElementById("game");
    const scoreText = document.getElementById("score");
    const restartButton = document.getElementById("restart");

    // --------------------------------------------------
    // SCENE
    // --------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87b8d8);

    scene.fog = new THREE.Fog(0x87b8d8, 35, 100);

    // --------------------------------------------------
    // CAMERA
    // --------------------------------------------------

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.05,
      200
    );

    // --------------------------------------------------
    // RENDERER
    // --------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // --------------------------------------------------
    // LIGHTING
    // --------------------------------------------------

    const ambient = new THREE.HemisphereLight(
      0xffffff,
      0x526b78,
      2.2
    );

    scene.add(ambient);

    const sun = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    sun.position.set(15, 25, 10);
    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -40;
    sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 40;
    sun.shadow.camera.bottom = -40;

    scene.add(sun);

    // --------------------------------------------------
    // GROUND
    // --------------------------------------------------

    const groundGeometry = new THREE.BoxGeometry(
      70,
      1,
      70
    );

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x3d6541,
      roughness: 0.9
    });

    const ground = new THREE.Mesh(
      groundGeometry,
      groundMaterial
    );

    ground.position.y = -0.5;
    ground.receiveShadow = true;

    scene.add(ground);

    // --------------------------------------------------
    // ARENA WALLS
    // --------------------------------------------------

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x4b5961
    });

    function createWall(x, y, z, sx, sy, sz) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        wallMaterial
      );

      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      scene.add(mesh);

      return mesh;
    }

    createWall(0, 2, -35, 70, 4, 1);
    createWall(0, 2, 35, 70, 4, 1);
    createWall(-35, 2, 0, 1, 4, 70);
    createWall(35, 2, 0, 1, 4, 70);

    // --------------------------------------------------
    // BALL COLORS
    // --------------------------------------------------

    const colors = [
      0xff3b30, // red
      0x2196f3, // blue
      0xffd400, // yellow
      0x34c759, // green
      0xff7a00, // orange
      0xaf52de  // purple
    ];

    // --------------------------------------------------
    // SORTING ZONES
    // --------------------------------------------------

    const zones = [];

    const zonePositions = [
      [-20, -20],
      [-7, -20],
      [7, -20],
      [20, -20],
      [-7, 20],
      [7, 20]
    ];

    for (let i = 0; i < colors.length; i++) {

      const color = colors[i];

      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(3.2, 3.2, 0.25, 48),
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.7
        })
      );

      base.position.set(
        zonePositions[i][0],
        0.13,
        zonePositions[i][1]
      );

      base.receiveShadow = true;
      scene.add(base);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(3.1, 0.16, 12, 48),
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          emissive: color,
          emissiveIntensity: 0.25
        })
      );

      ring.rotation.x = Math.PI / 2;

      ring.position.set(
        zonePositions[i][0],
        0.32,
        zonePositions[i][1]
      );

      scene.add(ring);

      zones.push({
        x: zonePositions[i][0],
        z: zonePositions[i][1],
        color,
        index: i
      });
    }

    // --------------------------------------------------
    // BALLS
    // --------------------------------------------------

    const balls = [];

    function createBall(index) {

      const geometry = new THREE.SphereGeometry(
        1,
        32,
        24
      );

      const material = new THREE.MeshStandardMaterial({
        color: colors[index],
        roughness: 0.35,
        metalness: 0.05
      });

      const ball = new THREE.Mesh(
        geometry,
        material
      );

      const angle = index * 1.05;

      ball.position.set(
        Math.cos(angle) * 12,
        2,
        Math.sin(angle) * 12
      );

      ball.castShadow = true;
      ball.receiveShadow = true;

      scene.add(ball);

      balls.push({
        mesh: ball,
        colorIndex: index,
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          0,
          (Math.random() - 0.5) * 2
        ),
        active: true
      });
    }

    for (let i = 0; i < colors.length; i++) {
      createBall(i);
    }

    // --------------------------------------------------
    // PLAYER
    // --------------------------------------------------

    let playerX = 0;
    let playerY = 1.7;
    let playerZ = 8;

    let velocityY = 0;

    const playerHeight = 1.7;

    const moveSpeed = 9;
    const jumpPower = 9;

    let yaw = 0;
    let pitch = 0;

    let locked = false;

    // --------------------------------------------------
    // KEYBOARD
    // --------------------------------------------------

    const keys = {};

    window.addEventListener("keydown", e => {

      keys[e.code] = true;

      if (
        e.code === "Space" &&
        playerY <= playerHeight + 0.05
      ) {
        velocityY = jumpPower;
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    // --------------------------------------------------
    // MOUSE LOOK
    // --------------------------------------------------

    canvas.addEventListener("click", () => {

      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
      }

    });

    document.addEventListener(
      "pointerlockchange",
      () => {

        locked =
          document.pointerLockElement === canvas;

      }
    );

    document.addEventListener(
      "mousemove",
      e => {

        if (!locked) return;

        yaw -= e.movementX * 0.0022;
        pitch -= e.movementY * 0.0022;

        pitch = THREE.MathUtils.clamp(
          pitch,
          -1.45,
          1.45
        );

      }
    );

    // --------------------------------------------------
    // BALL PHYSICS
    // --------------------------------------------------

    function updateBalls(dt) {

      for (const ball of balls) {

        if (!ball.active) continue;

        const mesh = ball.mesh;

        // Gravity
        ball.velocity.y -= 18 * dt;

        mesh.position.addScaledVector(
          ball.velocity,
          dt
        );

        // Floor
        if (mesh.position.y < 1) {

          mesh.position.y = 1;

          if (ball.velocity.y < 0) {
            ball.velocity.y *= -0.35;
          }

        }

        // Arena boundaries
        const limit = 33;

        if (mesh.position.x < -limit) {
          mesh.position.x = -limit;
          ball.velocity.x *= -0.5;
        }

        if (mesh.position.x > limit) {
          mesh.position.x = limit;
          ball.velocity.x *= -0.5;
        }

        if (mesh.position.z < -limit) {
          mesh.position.z = -limit;
          ball.velocity.z *= -0.5;
        }

        if (mesh.position.z > limit) {
          mesh.position.z = limit;
          ball.velocity.z *= -0.5;
        }

        // Friction
        ball.velocity.x *= Math.pow(0.35, dt);
        ball.velocity.z *= Math.pow(0.35, dt);

        // Player pushes balls
        const dx =
          mesh.position.x - playerX;

        const dz =
          mesh.position.z - playerZ;

        const horizontalDistance =
          Math.sqrt(dx * dx + dz * dz);

        if (
          horizontalDistance < 2.1 &&
          mesh.position.y < 3
        ) {

          const push =
            Math.max(
              0.1,
              2.1 - horizontalDistance
            );

          if (horizontalDistance > 0.001) {

            ball.velocity.x +=
              (dx / horizontalDistance) *
              push *
              7 *
              dt;

            ball.velocity.z +=
              (dz / horizontalDistance) *
              push *
              7 *
              dt;

          }

        }

        // Check matching zone
        for (const zone of zones) {

          const zx =
            mesh.position.x - zone.x;

          const zz =
            mesh.position.z - zone.z;

          const distance =
            Math.sqrt(zx * zx + zz * zz);

          if (
            ball.colorIndex === zone.index &&
            distance < 2.8 &&
            mesh.position.y < 2
          ) {

            ball.active = false;

            scene.remove(mesh);

            scoreText.textContent =
              Number(scoreText.textContent) + 1;

            break;
          }
        }
      }
    }

    // --------------------------------------------------
    // PLAYER MOVEMENT
    // --------------------------------------------------

    function updatePlayer(dt) {

      let forward = 0;
      let strafe = 0;

      if (keys["KeyW"] || keys["ArrowUp"]) {
        forward += 1;
      }

      if (keys["KeyS"] || keys["ArrowDown"]) {
        forward -= 1;
      }

      if (keys["KeyD"] || keys["ArrowRight"]) {
        strafe += 1;
      }

      if (keys["KeyA"] || keys["ArrowLeft"]) {
        strafe -= 1;
      }

      const length =
        Math.sqrt(
          forward * forward +
          strafe * strafe
        );

      if (length > 0) {

        forward /= length;
        strafe /= length;

        // Camera-relative movement
        const forwardX = -Math.sin(yaw);
        const forwardZ = -Math.cos(yaw);

        const rightX = Math.cos(yaw);
        const rightZ = -Math.sin(yaw);

        playerX +=
          (
            forwardX * forward +
            rightX * strafe
          ) *
          moveSpeed *
          dt;

        playerZ +=
          (
            forwardZ * forward +
            rightZ * strafe
          ) *
          moveSpeed *
          dt;
      }

      // Gravity
      velocityY -= 22 * dt;

      playerY += velocityY * dt;

      // Ground
      if (playerY < playerHeight) {

        playerY = playerHeight;
        velocityY = 0;

      }

      // Keep player inside arena
      playerX = THREE.MathUtils.clamp(
        playerX,
        -32,
        32
      );

      playerZ = THREE.MathUtils.clamp(
        playerZ,
        -32,
        32
      );

      // Camera
      camera.position.set(
        playerX,
        playerY,
        playerZ
      );

      camera.rotation.set(
        pitch,
        yaw,
        0,
        "YXZ"
      );
    }

    // --------------------------------------------------
    // RESTART
    // --------------------------------------------------

    restartButton.addEventListener(
      "click",
      () => {

        for (const ball of balls) {
          scene.remove(ball.mesh);
        }

        balls.length = 0;

        for (let i = 0; i < colors.length; i++) {
          createBall(i);
        }

        playerX = 0;
        playerY = playerHeight;
        playerZ = 8;

        velocityY = 0;

        yaw = 0;
        pitch = 0;

        scoreText.textContent = "0";

      }
    );

    // --------------------------------------------------
    // RESIZE
    // --------------------------------------------------

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

    // --------------------------------------------------
    // GAME LOOP
    // --------------------------------------------------

    let lastTime = performance.now();

    function animate(now) {

      requestAnimationFrame(animate);

      const dt =
        Math.min(
          (now - lastTime) / 1000,
          0.05
        );

      lastTime = now;

      updatePlayer(dt);
      updateBalls(dt);

      renderer.render(
        scene,
        camera
      );
    }

    animate(performance.now());

  </script>

</body>
</html>
